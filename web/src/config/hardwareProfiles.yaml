          pageFitCapacityA4: 3
        presets:
          - id: tesla-guard-28
            label: "Tesla GUARD prima – 28 bytů (10+10+8)"
            description: "3 sloupce, 3. sloupec má 8 bytů (horní 2 pozice prázdné), číslování zdola nahoru"
